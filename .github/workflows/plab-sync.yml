name: Plab Sync

on:
  workflow_dispatch:
  schedule:
    # ⚠️ 테스트 전용입니다. 스케줄이 실제로 도는지 빨리 확인하기 위해 5분 주기로 잠깐 걸어둔 것으로,
    # 정상 작동이 확인되면 다시 30분(또는 원하는) 주기로 되돌려야 합니다.
    - cron: '*/5 * * * *'

jobs:
  sync-plab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Sync Plab matches to Supabase (오늘부터 14일, 전국 데이터 저장 / 지역 필터는 조회 시점에)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-plab.js
