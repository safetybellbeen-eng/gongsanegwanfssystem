name: Plab Sync

on:
  workflow_dispatch:
  schedule:
    # 30분마다 자동 실행 (UTC 기준 cron이라 KST와는 무관하게 매시 정각/30분에 돌아갑니다)
    - cron: '*/30 * * * *'

jobs:
  sync-plab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Sync Plab matches to Supabase (오늘부터 14일, 전국 데이터 저장 / 지역 필터는 조회 시점에)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-plab.js
